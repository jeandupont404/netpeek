<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-adsense-account" content="ca-pub-5983443345513035">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NetPeek — Maintenance</title>
    <meta name="description" content="NetPeek is undergoing maintenance. We'll be back shortly.">
    <link rel="canonical" href="https://netpeek.pp.ua">
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --border: #2d3142;
            --accent: #6c63ff;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2rem;
        }
        .logo span { color: var(--accent); }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
        }
        .maintenance-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .status-row {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .status-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            text-align: left;
        }
        .status-item .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.25rem;
        }
        .status-item .value {
            font-weight: 600;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 1.25rem auto 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="logo" aria-label="NetPeek">Net<span>Peek</span></header>

    <main class="card">
        <div class="maintenance-icon" aria-hidden="true">&#128737;</div>
        <h1>We'll be back shortly</h1>
        <p>NetPeek is currently undergoing maintenance to bring you new tools and features. Please check back in a few minutes.</p>
        <div class="status-row">
            <div class="status-item">
                <span class="label">Status</span>
                <span class="value">Maintenance in progress</span>
            </div>
            <div class="status-item">
                <span class="label">What's new</span>
                <span class="value">Network tools and performance upgrades</span>
            </div>
        </div>
        <div class="spinner" aria-hidden="true"></div>
    </main>
</body>
</html>
